# Edge Function Integration Tests
#
# Runs the full Deno test suite against the deployed Supabase edge functions.
#
# Test tiers:
#   Tier 1 (always) — pure unit tests + unauthenticated 401/400 checks
#   Tier 2 (secrets) — SERVICE_ROLE_KEY + CRON_SECRET for infra/auth/guardrail tests
#   Tier 3 (state)   — admin/staff JWTs + state-specific IDs for idempotency tests
#
# Required GitHub Secrets (Tier 2):
#   SUPABASE_SERVICE_ROLE_KEY — service_role key for the Supabase project
#   CRON_SECRET              — shared secret for the daily-risk-snapshot cron path
#
# Optional GitHub Secrets (Tier 3):
#   TEST_ADMIN_TOKEN           — JWT for an admin user
#   TEST_STAFF_TOKEN           — JWT for a risk_officer or admin user
#   TEST_PAYOUT_ID_PENDING     — payout ID in pending/under_review state
#   TEST_PAYOUT_ID_APPROVED    — payout ID in approved state
#   TEST_ACCOUNT_ID            — account ID in active state
#   TEST_ACCOUNT_ID_BREACHED   — account ID in breached state

name: Edge Function Tests

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
  pull_request:
    branches: [main]
    paths:
      - 'supabase/functions/**'
  workflow_dispatch: # manual trigger

concurrency:
  group: edge-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Deno Edge Function Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v1.x

      # ─── Tier 1: Pure unit tests (no secrets needed) ───────────────
      - name: "Tier 1: normalizeSymbol unit tests"
        run: |
          deno test --allow-net --allow-env --allow-read \
            supabase/functions/reconcile-trades/normalizeSymbol.test.ts

      # ─── Tier 2: Auth + guardrail + snapshot tests ─────────────────
      - name: "Tier 2: daily-risk-snapshot auth tests"
        if: ${{ env.SUPABASE_SERVICE_ROLE_KEY != '' }}
        env:
          SUPABASE_URL: https://sfxmgwkrjwuerfkqxokq.supabase.co
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNmeG1nd2tyand1ZXJma3F4b2txIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njk5NTE0MTUsImV4cCI6MjA4NTUyNzQxNX0.uKTtbs9vWdtAJLDFod4evkVj1DLjJkRloIRWnbu5GoM' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          deno test --allow-net --allow-env --allow-read \
            supabase/functions/daily-risk-snapshot/auth_test.ts

      - name: "Tier 2: payout guardrail tests"
        if: ${{ env.SUPABASE_SERVICE_ROLE_KEY != '' }}
        env:
          SUPABASE_URL: https://sfxmgwkrjwuerfkqxokq.supabase.co
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNmeG1nd2tyand1ZXJma3F4b2txIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njk5NTE0MTUsImV4cCI6MjA4NTUyNzQxNX0.uKTtbs9vWdtAJLDFod4evkVj1DLjJkRloIRWnbu5GoM' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          deno test --allow-net --allow-env --allow-read \
            supabase/functions/payout-actions/guardrail_test.ts

      # ─── Tier 3: Idempotency tests (need state-specific test data) ─
      - name: "Tier 3: payout-actions idempotency tests"
        if: ${{ env.TEST_ADMIN_TOKEN != '' }}
        env:
          VITE_SUPABASE_URL: https://sfxmgwkrjwuerfkqxokq.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNmeG1nd2tyand1ZXJma3F4b2txIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njk5NTE0MTUsImV4cCI6MjA4NTUyNzQxNX0.uKTtbs9vWdtAJLDFod4evkVj1DLjJkRloIRWnbu5GoM' }}
          TEST_ADMIN_TOKEN: ${{ secrets.TEST_ADMIN_TOKEN }}
          TEST_PAYOUT_ID_PENDING: ${{ secrets.TEST_PAYOUT_ID_PENDING }}
          TEST_PAYOUT_ID_APPROVED: ${{ secrets.TEST_PAYOUT_ID_APPROVED }}
        run: |
          deno test --allow-net --allow-env --allow-read \
            supabase/functions/payout-actions/idempotency_test.ts

      - name: "Tier 3: review-actions idempotency tests"
        if: ${{ env.TEST_STAFF_TOKEN != '' }}
        env:
          VITE_SUPABASE_URL: https://sfxmgwkrjwuerfkqxokq.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNmeG1nd2tyand1ZXJma3F4b2txIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njk5NTE0MTUsImV4cCI6MjA4NTUyNzQxNX0.uKTtbs9vWdtAJLDFod4evkVj1DLjJkRloIRWnbu5GoM' }}
          TEST_STAFF_TOKEN: ${{ secrets.TEST_STAFF_TOKEN }}
          TEST_ACCOUNT_ID: ${{ secrets.TEST_ACCOUNT_ID }}
          TEST_ACCOUNT_ID_BREACHED: ${{ secrets.TEST_ACCOUNT_ID_BREACHED }}
        run: |
          deno test --allow-net --allow-env --allow-read \
            supabase/functions/review-actions/idempotency_test.ts
