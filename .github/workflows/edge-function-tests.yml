# Edge Function Integration Tests
#
# Tiered test suite for Supabase edge functions.
#
#   Tier 1 (always)  — pure unit tests, no secrets needed
#   Tier 2 (secrets) — SERVICE_ROLE_KEY + CRON_SECRET for auth/guardrail tests
#   Tier 3 (state)   — admin/staff JWTs + state-specific IDs for idempotency tests
#
# Required GitHub Secrets (Tier 2):
#   SUPABASE_SERVICE_ROLE_KEY — service_role key for the Supabase project
#   CRON_SECRET              — shared secret for the daily-risk-snapshot cron path
#
# Optional GitHub Secrets (Tier 3):
#   TEST_ADMIN_TOKEN           — JWT for an admin user
#   TEST_STAFF_TOKEN           — JWT for a risk_officer or admin user
#   TEST_PAYOUT_ID_PENDING     — payout ID in pending/under_review state
#   TEST_PAYOUT_ID_APPROVED    — payout ID in approved state
#   TEST_ACCOUNT_ID            — account ID in active state
#   TEST_ACCOUNT_ID_BREACHED   — account ID in breached state
#
# Workflow Dispatch Inputs:
#   run_cron_path — when true, calls the function with X-Cron-Secret to verify
#                   the live cron auth path and econ gate behavior

name: Edge Function Tests

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'src/components/landing/**'
      - 'src/components/checkout/**'
      - 'src/pages/Index.tsx'
      - 'src/pages/Rules.tsx'
      - 'src/pages/Checkout.tsx'
      - 'src/lib/claims.ts'
      - 'src/lib/payout-copy.ts'
      - 'src/lib/pricing-data.ts'
      - 'scripts/lint-copy.sh'
      - '.github/workflows/edge-function-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'src/components/landing/**'
      - 'src/components/checkout/**'
      - 'src/pages/Index.tsx'
      - 'src/pages/Rules.tsx'
      - 'src/pages/Checkout.tsx'
      - 'src/lib/claims.ts'
      - 'src/lib/payout-copy.ts'
      - 'src/lib/pricing-data.ts'
      - 'scripts/lint-copy.sh'
      - '.github/workflows/edge-function-tests.yml'
  workflow_dispatch:
    inputs:
      run_cron_path:
        description: 'Run live cron-secret verification against deployed function'
        required: false
        type: boolean
        default: false

concurrency:
  group: edge-function-tests-${{ github.ref }}
  cancel-in-progress: true

# ─────────────────────────────────────────────────────────────────────────────
# Tier 0 — Copy lint (no secrets, no Deno — pure bash)
# Flags absolutist/unverifiable language in marketing copy.
# ─────────────────────────────────────────────────────────────────────────────
jobs:
  tier0_copy_lint:
    name: "Tier 0 — Copy Lint (absolutist words)"
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - name: "Lint marketing copy for banned words"
        run: bash scripts/lint-copy.sh

# ─────────────────────────────────────────────────────────────────────────────
# Tier 1 — Pure unit tests (no secrets, no network dependencies)
# ─────────────────────────────────────────────────────────────────────────────
  tier1_unit:
    name: "Tier 1 — Unit (no secrets)"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v1.x

      - name: "normalizeSymbol unit tests"
        run: |
          deno test --allow-net --allow-env --allow-read \
            supabase/functions/reconcile-trades/normalizeSymbol.test.ts

  # ───────────────────────────────────────────────────────────────────────────
  # Tier 2 — Integration tests (service role + cron secret)
  #
  # On main: FAIL FAST if required secrets are missing (never silently skip).
  # On PRs:  Skip gracefully (fork PRs won't have secrets).
  # ───────────────────────────────────────────────────────────────────────────
  tier2_integration:
    name: "Tier 2 — Integration (service role + cron)"
    runs-on: ubuntu-latest
    needs: [tier1_unit]
    timeout-minutes: 10
    env:
      SUPABASE_URL: https://sfxmgwkrjwuerfkqxokq.supabase.co
      VITE_SUPABASE_URL: https://sfxmgwkrjwuerfkqxokq.supabase.co
      SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNmeG1nd2tyand1ZXJma3F4b2txIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njk5NTE0MTUsImV4cCI6MjA4NTUyNzQxNX0.uKTtbs9vWdtAJLDFod4evkVj1DLjJkRloIRWnbu5GoM' }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNmeG1nd2tyand1ZXJma3F4b2txIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njk5NTE0MTUsImV4cCI6MjA4NTUyNzQxNX0.uKTtbs9vWdtAJLDFod4evkVj1DLjJkRloIRWnbu5GoM' }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v1.x

      # On main: fail-fast if required secrets are missing.
      # On PRs: warn but continue (tests self-skip via ignore flags).
      - name: "Enforce required secrets (main only)"
        if: github.ref == 'refs/heads/main'
        run: |
          missing=0
          [ -z "${SUPABASE_SERVICE_ROLE_KEY}" ] && echo "::error::SUPABASE_SERVICE_ROLE_KEY is missing" && missing=1
          [ -z "${CRON_SECRET}" ] && echo "::error::CRON_SECRET is missing" && missing=1
          [ $missing -eq 1 ] && echo "::error::Tier 2 secrets MUST be configured on main. Add them in Settings → Secrets." && exit 1
          echo "✓ All Tier 2 secrets present"

      - name: "Sanity check env (PRs — non-blocking)"
        if: github.ref != 'refs/heads/main'
        run: |
          [ -n "${SUPABASE_SERVICE_ROLE_KEY}" ] && echo "✓ SERVICE_ROLE_KEY" || echo "⚠ SERVICE_ROLE_KEY missing — some tests will self-skip"
          [ -n "${CRON_SECRET}" ] && echo "✓ CRON_SECRET" || echo "⚠ CRON_SECRET missing — some tests will self-skip"

      - name: "daily-risk-snapshot auth tests"
        run: |
          deno test --allow-net --allow-env --allow-read \
            supabase/functions/daily-risk-snapshot/auth_test.ts

      - name: "payout-actions guardrail tests"
        run: |
          deno test --allow-net --allow-env --allow-read \
            supabase/functions/payout-actions/guardrail_test.ts

  # ───────────────────────────────────────────────────────────────────────────
  # Tier 3 — Stateful E2E (tokens + state-specific IDs)
  #
  # Same pattern: fail-fast on main, skip gracefully on PRs.
  # ───────────────────────────────────────────────────────────────────────────
  tier3_stateful:
    name: "Tier 3 — Stateful E2E (tokens + IDs)"
    runs-on: ubuntu-latest
    needs: [tier2_integration]
    timeout-minutes: 10
    env:
      SUPABASE_URL: https://sfxmgwkrjwuerfkqxokq.supabase.co
      VITE_SUPABASE_URL: https://sfxmgwkrjwuerfkqxokq.supabase.co
      SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNmeG1nd2tyand1ZXJma3F4b2txIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njk5NTE0MTUsImV4cCI6MjA4NTUyNzQxNX0.uKTtbs9vWdtAJLDFod4evkVj1DLjJkRloIRWnbu5GoM' }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNmeG1nd2tyand1ZXJma3F4b2txIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njk5NTE0MTUsImV4cCI6MjA4NTUyNzQxNX0.uKTtbs9vWdtAJLDFod4evkVj1DLjJkRloIRWnbu5GoM' }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      TEST_ADMIN_TOKEN: ${{ secrets.TEST_ADMIN_TOKEN }}
      TEST_STAFF_TOKEN: ${{ secrets.TEST_STAFF_TOKEN }}
      TEST_PAYOUT_ID_PENDING: ${{ secrets.TEST_PAYOUT_ID_PENDING }}
      TEST_PAYOUT_ID_APPROVED: ${{ secrets.TEST_PAYOUT_ID_APPROVED }}
      TEST_ACCOUNT_ID: ${{ secrets.TEST_ACCOUNT_ID }}
      TEST_ACCOUNT_ID_BREACHED: ${{ secrets.TEST_ACCOUNT_ID_BREACHED }}
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v1.x

      # On main: fail-fast if Tier 3 secrets are missing.
      - name: "Enforce required secrets (main only)"
        if: github.ref == 'refs/heads/main'
        run: |
          missing=0
          [ -z "${TEST_ADMIN_TOKEN}" ] && echo "::error::TEST_ADMIN_TOKEN is missing" && missing=1
          [ -z "${TEST_STAFF_TOKEN}" ] && echo "::error::TEST_STAFF_TOKEN is missing" && missing=1
          [ -z "${TEST_PAYOUT_ID_PENDING}" ] && echo "::error::TEST_PAYOUT_ID_PENDING is missing" && missing=1
          [ -z "${TEST_PAYOUT_ID_APPROVED}" ] && echo "::error::TEST_PAYOUT_ID_APPROVED is missing" && missing=1
          [ -z "${TEST_ACCOUNT_ID}" ] && echo "::error::TEST_ACCOUNT_ID is missing" && missing=1
          [ -z "${TEST_ACCOUNT_ID_BREACHED}" ] && echo "::error::TEST_ACCOUNT_ID_BREACHED is missing" && missing=1
          [ $missing -eq 1 ] && echo "::error::Tier 3 secrets MUST be configured on main. Add them in Settings → Secrets." && exit 1
          echo "✓ All Tier 3 secrets present"

      - name: "Sanity check env (PRs — non-blocking)"
        if: github.ref != 'refs/heads/main'
        run: |
          [ -n "${TEST_ADMIN_TOKEN}" ] && echo "✓ TEST_ADMIN_TOKEN" || echo "⚠ TEST_ADMIN_TOKEN missing — payout idempotency tests will self-skip"
          [ -n "${TEST_STAFF_TOKEN}" ] && echo "✓ TEST_STAFF_TOKEN" || echo "⚠ TEST_STAFF_TOKEN missing — review idempotency tests will self-skip"

      - name: "payout-actions idempotency tests"
        run: |
          deno test --allow-net --allow-env --allow-read \
            supabase/functions/payout-actions/idempotency_test.ts

      - name: "review-actions idempotency tests"
        run: |
          deno test --allow-net --allow-env --allow-read \
            supabase/functions/review-actions/idempotency_test.ts

  # ───────────────────────────────────────────────────────────────────────────
  # Cron Path Verification (manual dispatch only)
  #
  # Proves the live cron auth path works end-to-end:
  #   1. Calls the function with X-Cron-Secret
  #   2. Asserts 200 + success=true + triggered_by=cron
  #   3. Verifies snapshot was written to risk_snapshots table
  # ───────────────────────────────────────────────────────────────────────────
  cron_path_verify:
    name: "Cron Path — Live Verification"
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_cron_path == true }}
    timeout-minutes: 5
    env:
      SUPABASE_URL: https://sfxmgwkrjwuerfkqxokq.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: "Enforce cron secrets"
        run: |
          [ -z "${SUPABASE_SERVICE_ROLE_KEY}" ] && echo "::error::SUPABASE_SERVICE_ROLE_KEY required for cron verify" && exit 1
          [ -z "${CRON_SECRET}" ] && echo "::error::CRON_SECRET required for cron verify" && exit 1
          echo "✓ Cron verification secrets present"

      - name: "Call daily-risk-snapshot with X-Cron-Secret"
        run: |
          RESPONSE=$(curl -s -w "\n%{http_code}" \
            -X POST "${SUPABASE_URL}/functions/v1/daily-risk-snapshot" \
            -H "Content-Type: application/json" \
            -H "X-Cron-Secret: ${CRON_SECRET}")

          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -n -1)

          echo "HTTP status: ${HTTP_CODE}"
          echo "Response body: ${BODY}"

          # Assert 200
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Expected HTTP 200, got ${HTTP_CODE}"
            exit 1
          fi

          # Assert success=true
          echo "$BODY" | grep -q '"success":true' || echo "$BODY" | grep -q '"success": true'
          if [ $? -ne 0 ]; then
            echo "::error::Response missing success:true"
            exit 1
          fi

          # Assert triggered_by=cron
          echo "$BODY" | grep -q '"triggered_by":"cron"' || echo "$BODY" | grep -q '"triggered_by": "cron"'
          if [ $? -ne 0 ]; then
            echo "::error::Response missing triggered_by:cron"
            exit 1
          fi

          echo "✓ Cron path verification passed"

      - name: "Verify snapshot written (query risk_snapshots)"
        run: |
          # Query the most recent snapshot to confirm it was written
          RESULT=$(curl -s \
            "${SUPABASE_URL}/rest/v1/risk_snapshots?order=created_at.desc&limit=1&select=id,snapshot_type,created_at" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}")

          echo "Latest snapshot: ${RESULT}"

          # Basic check: response should be a non-empty array
          if echo "$RESULT" | grep -q '"id"'; then
            echo "✓ Snapshot row exists in risk_snapshots"
          else
            echo "::warning::Could not confirm snapshot row — check manually"
          fi
